---
- name: Prepare Local NVMe Storage for Longhorn
  hosts: cluster
  become: true

  tasks:
    - name: Configure and Mount NVMe Storage
      block:
        - name: Ensure filesystem utilities are present
          ansible.builtin.package:
            name:
              - parted
              - e2fsprogs
            state: present

        - name: Partition the NVMe drive if unpartitioned
          community.general.parted:
            device: /dev/nvme0n1
            number: 1
            state: present
            fs_type: ext4
            label: gpt

        - name: Format the NVMe partition as Ext4
          community.general.filesystem:
            fstype: ext4
            dev: /dev/nvme0n1p1
            # Multi-mount protection to prevent corruption across the cluster
            opts: -O mmp
            # force: false ensures Ansible will skip if ANY filesystem exists
            force: false

        - name: Create dedicated Longhorn directory path
          ansible.builtin.file:
            path: /var/lib/longhorn
            state: directory
            mode: '0750'

        - name: Mount NVMe partition to Longhorn path
          ansible.posix.mount:
            path: /var/lib/longhorn
            src: /dev/nvme0n1p1
            fstype: ext4
            # Optimized parameters to protect drive life
            opts: defaults,noatime,nodiratime
            state: mounted
      when: nvme_gb | default(0) | int > 0

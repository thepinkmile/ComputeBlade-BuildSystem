---
- name: Configuring Jumbo Frames and VLAN Trunks on Nodes
  hosts: cluster
  become: true
  gather_facts: true

  vars:
    interface_phys: "eth0"
    mtu_size: "{{ 9000 if (module_type in jumbo_supported_modules) else 1500 }}"
    vlans:
      - vlan_id: 10
        gateway: "192.168.10.1"
        conn_name: vlan-10
      - vlan_id: 20
        gateway: "192.168.20.1"
        conn_name: vlan-20
    
    vlan10_gateway: "192.168.10.1"
    vlan20_gateway: "192.168.20.1"

  tasks:
    - name: Parse hardware MAC address suffix dynamically
      set_fact:
        mac_suffix: "{{ ansible_facts[interface_phys]['macaddress'].split(':')[2:] | join(':') }}"

    - name: Atomic cycle physical interface to force MTU 9000
      ansible.builtin.shell: >
        ip link set {{ interface_phys }} down && 
        ip link set {{ interface_phys }} mtu {{ mtu_size }} && 
        ip link set {{ interface_phys }} up
      async: 10
      poll: 0
      changed_when: true

    - name: Settle cluster node network connections
      ansible.builtin.pause:
        seconds: 10

    - name: Build VLAN Base Link Profiles
      community.general.nmcli:
        conn_name: "{{ item.conn_name }}-base"
        ifname: "{{ interface_phys }}.{{ item.vlan_id }}"
        type: vlan
        vlanid: "{{ item.vlan_id }}"
        vlandev: "{{ interface_phys }}"
        mtu: "{{ mtu_size }}"
        ip4: "disabled"
        ip6: "ignore"
        state: present
        autoconnect: true
      loop: "{{ vlans }}"

    - name: Build MACVLAN Interfaces with Unique MAC Architecture
      community.general.nmcli:
        conn_name: "{{ item.conn_name }}"
        ifname: "mv-{{ interface_phys }}.{{ item.vlan_id }}"
        type: macvlan
        cloned_mac: "02:{{ item.vlan_id }}:{{ mac_suffix }}"
        macvlan:
          mode: 2 # Value 2 explicitly specifies 'bridge' mode to the module compiler
          parent: "{{ interface_phys }}.{{ item.vlan_id }}"
        mtu: "{{ mtu_size }}"
        never_default4: true
        route_metric4: 210
        state: present
        autoconnect: true
      loop: "{{ vlans }}"

    - name: Wait for DHCP allocation to settle
      ansible.builtin.pause:
        seconds: 10

    - name: Validate VLAN 10 Egress to OpenWRT Gateway
      ansible.builtin.command: "ping -I mv-{{ interface_phys }}.{{ item.vlan_id }} {{ item.gateway }} -c 3"
      register: ping_result
      failed_when: ping_result.rc != 0
      changed_when: false
      loop: "{{ vlans }}"

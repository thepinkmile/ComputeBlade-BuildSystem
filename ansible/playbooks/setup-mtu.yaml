---
- name: Configuring Jumbo Frames and VLAN Trunks on Nodes
  hosts: cluster
  become: true
  gather_facts: true

  vars:
    interface_phys: "eth0"
    mtu_size: "{{ 9000 if (module_type in jumbo_supported_modules) else 1500 }}"
    vlans:
      - vlan_id: 10
        gateway: "192.168.10.1"
        conn_name: vlan-10
        hostname_suffix: "-pods"
      - vlan_id: 20
        gateway: "192.168.20.1"
        conn_name: vlan-20
        hostname_suffix: "-storage"

  tasks:
    - name: Parse hardware MAC address suffix dynamically
      set_fact:
        mac_suffix: "{{ ansible_facts[interface_phys]['macaddress'].split(':')[2:] | join(':') }}"

    - name: Atomic cycle physical interface to force MTU 9000
      ansible.builtin.shell: >
        ip link set {{ interface_phys }} down && 
        ip link set {{ interface_phys }} mtu {{ mtu_size }} && 
        ip link set {{ interface_phys }} up
      async: 10
      poll: 0
      changed_when: true

    - name: Settle cluster node network connections
      ansible.builtin.pause:
        seconds: 10

    - name: Create the VLAN interface profile with DHCP and IPv6 disabled
      community.general.nmcli:
        conn_name: "vlan{{ item.vlan_id }}"
        ifname: "{{ interface_phys }}.{{ item.vlan_id }}"
        type: vlan
        vlanid: "{{ item.vlan_id }}"
        vlandev: "eth0"
        mtu: "{{ mtu_size }}"
        method4: auto
        method6: disabled
        dhcp_client_id: "{{ ansible_hostname }}{{ item.hostname_suffix }}"
        state: present
      loop: "{{ vlans }}"

    - name: Check current cloned MAC address setting using strict property
      ansible.builtin.command: >
        nmcli -g 802-3-ethernet.cloned-mac-address connection show "vlan{{ item.vlan_id }}"
      register: current_mac
      changed_when: false
      failed_when: false
      loop: "{{ vlans }}"

    - name: Apply custom cloned MAC address if it differs
      ansible.builtin.command: >
        nmcli connection modify "vlan{{ item.item.vlan_id }}" 
        802-3-ethernet.cloned-mac-address "02:{{ item.item.vlan_id }}:{{ mac_suffix }}" 
        ipv4.dhcp-hostname "{{ ansible_hostname }}{{ item.item.hostname_suffix }}"
      when: item.stdout != "02:" ~ item.item.vlan_id | string ~ ":" ~ mac_suffix
      register: nm_modify
      loop: "{{ current_mac.results }}"

    - name: Activate connection to trigger dnsmasq DHCP lease
      community.general.nmcli:
        conn_name: "vlan{{ item.item.vlan_id }}"
        state: up
      when: nm_modify.changed or item.rc != 0
      loop: "{{ current_mac.results }}"

    - name: Wait for DHCP allocation to settle
      ansible.builtin.pause:
        seconds: 10

    - name: Validate VLAN Egress to OpenWRT Gateway
      ansible.builtin.command: "ping -I {{ interface_phys }}.{{ item.vlan_id }} {{ item.gateway }} -c 3"
      register: ping_result
      failed_when: ping_result.rc != 0
      changed_when: false
      loop: "{{ vlans }}"

---
- name: Configuring Jumbo Frames and VLAN Trunks on Nodes
  hosts: cluster
  become: true

  tasks:
    - name: Configure Base Trunk Ethernet
      community.general.nmcli:
        conn_name: "trunk-eth0"
        ifname: eth0
        type: ethernet
        state: present
        mtu: "{{ 9000 if (module_type in jumbo_supported_modules) else 1500 }}"
      notify: Reload NetworkManager

    - name: Configure VLAN 10
      community.general.nmcli:
        conn_name: "vlan-10"
        ifname: eth0.10
        type: vlan
        vlanid: 10
        vlandev: eth0
        state: present
        mac: "02:{{ ansible_facts['eth0']['macaddress'][3:14] }}:10"
        mtu: "{{ 9000 if (module_type in jumbo_supported_modules) else 1500 }}"
      notify: Reload NetworkManager

    - name: Configure VLAN 20
      community.general.nmcli:
        conn_name: "vlan-20"
        ifname: eth0.20
        type: vlan
        vlanid: 20
        vlandev: eth0
        state: present
        mac: "02:{{ ansible_facts['eth0']['macaddress'][3:14] }}:20"
        mtu: "{{ 9000 if (module_type in jumbo_supported_modules) else 1500 }}"
      notify: Reload NetworkManager

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: v1.7.2
    releaseName: longhorn
    namespace: longhorn-system
    valuesInline:
      defaultSettings:
        defaultDataPath: "/var/lib/longhorn"
        defaultReplicaCount: 2
namespace: longhorn-system

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - namespace.yaml
  - dashboard-ingress.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesInline:
      defaultSettings:
        defaultDataPath: /var/lib/longhorn
        defaultReplicaCount: 3
        createDefaultDiskLabeledNodes: false
        storageNetwork: default/vlan20-backplane
      persistence:
        defaultClass: true
        defaultClassReplicaCount: 3
patches:
  - target:
      kind: DaemonSet
      name: longhorn-manager
      namespace: longhorn-system
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - cm4-tpm-1a35017f
  - target:
      kind: Deployment
      name: longhorn-driver-deployer
      namespace: longhorn-system
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - cm4-tpm-1a35017f

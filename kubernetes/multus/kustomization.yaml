apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/master/deployments/multus-daemonset.yml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/master/doc/crds/whereabouts.cni.cncf.io_ippools.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/master/doc/crds/whereabouts.cni.cncf.io_overlappingrangeipreservations.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/master/doc/crds/daemonset-install.yaml
  - vlan-networks.yaml

patches:
  # Patch Thin Multus hostPath volumes and kubeconfig host path for K3s
  - target:
      kind: DaemonSet
      name: kube-multus-ds
      namespace: kube-system
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /var/lib/rancher/k3s/agent/etc/cni/net.d
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /var/lib/rancher/k3s/data/cni
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: etc-cni
          hostPath:
            path: /etc/cni
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --multus-kubeconfig-file-host=/var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: install-cni-plugins
          image: curlimages/curl:8.10.1
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              ln -sfn /var/lib/rancher/k3s/agent/etc/cni/net.d /host/etc-cni/net.d
              if [ ! -f /host/opt/cni/bin/macvlan ]; then
                curl -sL https://github.com/containernetworking/plugins/releases/download/v1.10.0/cni-plugins-linux-arm64-v1.10.0.tgz | tar -xz -C /host/opt/cni/bin ./macvlan ./ipvlan ./vlan
              fi
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
            - name: etc-cni
              mountPath: /host/etc-cni

  # Patch Whereabouts hostPath volumes for K3s
  - target:
      kind: DaemonSet
      name: whereabouts
      namespace: kube-system
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/hostPath/path
        value: /var/lib/rancher/k3s/data/cni
      - op: replace
        path: /spec/template/spec/volumes/1/hostPath/path
        value: /var/lib/rancher/k3s/agent/etc/cni/net.d

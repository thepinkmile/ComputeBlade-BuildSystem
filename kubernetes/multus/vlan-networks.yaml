# --- 1. VLAN 10 (eth0.10) ---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan10-pods
  namespace: default
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "vlan10-pods",
    "type": "macvlan",
    "master": "eth0.10",
    "mode": "bridge",
    "ipam": {
      "type": "whereabouts",
      "range": "192.168.10.100-192.168.10.199/24"
    }
  }'

# --- 2. VLAN 20 (eth0.20) ---
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan20-backplane
  namespace: default
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "vlan20-backplane",
    "type": "macvlan",
    "master": "eth0.20",
    "mode": "bridge",
    "ipam": {
      "type": "whereabouts",
      "range": "192.168.20.100-192.168.20.199/24"
    }
  }'

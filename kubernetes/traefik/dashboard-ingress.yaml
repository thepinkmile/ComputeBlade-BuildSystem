apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: vlan1-only-allowlist
  namespace: traefik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dashboard-redirect
  namespace: traefik
spec:
  redirectRegex:
    regex: ^https://traefik\.home\.gbt\.org\.uk(/dashboard)?/?$
    replacement: https://traefik.home.gbt.org.uk/dashboard/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.home.gbt.org.uk`) && (Path(`/`) || Path(`/dashboard`))
      kind: Rule
      middlewares:
        - name: vlan1-only-allowlist
        - name: dashboard-redirect
      services:
        - name: api@internal
          kind: TraefikService
    - match: Host(`traefik.home.gbt.org.uk`) && (PathPrefix(`/dashboard/`) || PathPrefix(`/api`))
      kind: Rule
      middlewares:
        - name: vlan1-only-allowlist
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}

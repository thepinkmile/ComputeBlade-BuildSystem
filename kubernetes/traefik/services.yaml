# --- 1. Untagged / Default VLAN 1 (Proxy + Dashboard on 8080) ---
apiVersion: v1
kind: Service
metadata:
  name: traefik-vlan1
  namespace: traefik
  annotations:
    metallb.universe.tf/address-pool: default-vlan-pool
    metallb.universe.tf/loadBalancerIPs: 192.168.1.250
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP


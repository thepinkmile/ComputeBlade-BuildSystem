# --- 1. Primary Domain + Nested Private Sub-Wildcards ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gbt-org-uk-tls
  namespace: traefik
spec:
  secretName: gbt-org-uk-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "*.gbt.org.uk"
  dnsNames:
    - "gbt.org.uk"
    - "*.gbt.org.uk"
    - "*.home.gbt.org.uk"
    - "*.mgnt.gbt.org.uk"

